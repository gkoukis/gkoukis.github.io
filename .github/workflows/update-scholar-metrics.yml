name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public Google Scholar metrics
        run: python scripts/update_scholar_metrics.py

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- scholar_metrics.json; then
            echo "Scholar metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar_metrics.json
          git commit -m "Update Google Scholar metrics"
          git push
